name: Build Windows Launcher

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - copilot/**
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements/windows-build.txt'

      - name: Build Windows launcher
        run: ./scripts/build-windows.ps1 -PythonExecutable (Get-Command python).Source -Clean -Runtime cpu -Bundle onedir

      - name: Smoke test launcher --version
        run: ./dist/windows-launcher/criticalmaas/criticalmaas.exe --version

      - name: Smoke test launcher --help
        run: ./dist/windows-launcher/criticalmaas/criticalmaas.exe --help

      - name: Upload launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: criticalmaas-windows-launcher
          path: dist/windows-launcher/criticalmaas
          if-no-files-found: error
